name: Smoke test
on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: imge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/setup.sh
      - run: python3 scripts/smoke.py --isolated-compose
      - if: failure()
        run: docker compose logs
      - if: always()
        run: test ! -f .env || docker compose down --volumes
