name: Smoke test
on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/setup.sh
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: test ! -f .env || docker compose down --volumes
