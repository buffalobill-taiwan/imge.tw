real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Add one set_real_ip_from directive per trusted reverse proxy address or CIDR.
# Use the source address this container sees for the proxy connection.
# set_real_ip_from 192.0.2.10;

server {
    listen 8080;
    server_name _;
    root /app/public/assets;
    client_max_body_size 10M;

    location ~ ^/(?:css|js)/ {
        try_files $uri =404;
    }
    location = /favicon.ico {
        try_files $uri =404;
    }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass app:9000;
    }
}

server {
    listen 8081;
    server_name _;
    root /app;

    location ^~ /storage/i/ {
        internal;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/image.php;
        fastcgi_pass app:9000;
    }
}

server {
    listen 8082;
    server_name _;
    root /app;

    location ^~ /storage/t/ {
        internal;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/thumbnail.php;
        fastcgi_pass app:9000;
    }
}
